# Copy to <repo>/.github/workflows/reviewpilot.yml to turn on ReviewPilot for that repo.
name: reviewpilot

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

# Pushes cancel a stale review. Each comment gets its own group, because ReviewPilot's own
# comments are issue_comment events too and would otherwise cancel the run that posts them.
concurrency:
  group: reviewpilot-${{ github.event.pull_request.number || format('comment-{0}', github.event.comment.id) }}
  cancel-in-progress: true

jobs:
  review:
    uses: rafay99-epic/reviewpilot/.github/workflows/review.yml@main
    secrets:
      REVIEWPILOT_API_KEY: ${{ secrets.CMD_API_KEY }}
      REVIEWPILOT_APP_ID: ${{ secrets.REVIEWPILOT_APP_ID }}
      REVIEWPILOT_PRIVATE_KEY: ${{ secrets.REVIEWPILOT_PRIVATE_KEY }}
