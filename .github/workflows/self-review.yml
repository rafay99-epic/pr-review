# Reviews this repo's own PRs with the shared workflow, so config changes get tested here first.
name: self-review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Local path, not @main: a PR that edits the shared workflow is reviewed by its own version.
    uses: ./.github/workflows/pr-agent.yml
    secrets:
      CMD_API_KEY: ${{ secrets.CMD_API_KEY }}
