# Deploys the ReviewPilot server to Fly.io whenever main changes the server, the action it
# runs, or the deploy config. Needs the FLY_API_TOKEN secret (a deploy token for the app).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - packages/action/**
      - packages/server/**
      - Dockerfile
      - fly.toml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy.yml
      - apps/web/public/seal-key.pem
  workflow_dispatch:

permissions:
  contents: read

# Deploys never overlap; a newer push waits for the one in flight.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The website seals keys with the committed public key; the server opens them with
      # SEAL_KEY. If they ever differ, every sealed key fails, so the deploy fails loudly.
      # A server without SEAL_KEY answers 404 and is skipped.
      - name: Seal key matches the website
        run: |
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          code=$(curl -sS -o served.pem -w '%{http_code}' --retry 5 --retry-all-errors "https://$app.fly.dev/seal-key")
          if [ "$code" = 404 ]; then echo "no SEAL_KEY on $app, skipped"; exit 0; fi
          diff served.pem apps/web/public/seal-key.pem
