# Deploys the ReviewPilot server to Fly.io whenever main changes the server, the action it
# runs, or the deploy config. Needs the FLY_API_TOKEN secret (a deploy token for the app).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - packages/action/**
      - packages/server/**
      - Dockerfile
      - fly.toml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy.yml
      - apps/web/public/seal-key.pem
  workflow_dispatch:

permissions:
  contents: read

env:
  # `off` for a server without SEAL_KEY (one that takes no sealed keys); see the last step.
  SEALED_KEYS: required

# Deploys never overlap; a newer push waits for the one in flight.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The website seals keys with the committed public key; the server opens them with
      # SEAL_KEY. If the server lost SEAL_KEY or holds a different one, every sealed key fails,
      # so the deploy fails loudly. A server that takes no sealed keys sets SEALED_KEYS: off.
      - name: Seal key matches the website
        if: env.SEALED_KEYS != 'off'
        run: |
          app=$(sed -n 's/^app = "\(.*\)"/\1/p' fly.toml)
          curl -fsS --retry 5 --retry-all-errors "https://$app.fly.dev/seal-key" -o served.pem \
            || { echo "::error::$app has no SEAL_KEY (or /seal-key failed); sealed keys cannot be opened"; exit 1; }
          diff served.pem apps/web/public/seal-key.pem \
            || { echo "::error::SEAL_KEY on $app does not match apps/web/public/seal-key.pem"; exit 1; }
