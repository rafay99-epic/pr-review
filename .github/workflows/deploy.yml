# Deploys the ReviewPilot server to Fly.io whenever main changes the server, the action it
# runs, or the deploy config. Needs the FLY_API_TOKEN secret (a deploy token for the app).
name: deploy

on:
  push:
    branches: [main]
    paths:
      - packages/action/**
      - packages/server/**
      - Dockerfile
      - fly.toml
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

# Deploys never overlap; a newer push waits for the one in flight.
concurrency:
  group: deploy-fly
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
