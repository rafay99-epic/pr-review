# Reusable PR-Agent review: GLM-5.3 Flash at medium effort (DeepSeek V4.1 Flash Fast fallback)
# through Command Code's OpenAI-compatible provider API. Repos opt in with the caller in
# caller.yml; every model/tool setting lives here so one edit updates all repos.
#
# Runs only on open PRs authored by the repo owner (rafay99-epic or SyntaxLabTechnology)
# and on their /commands. Never on merge or main. Only /review runs automatically: a
# thorough bug/security pass posted as inline comments. /improve runs only when commented.
name: pr-agent

on:
  workflow_call:
    secrets:
      CMD_API_KEY:
        required: true

env:
  GITHUB_TOKEN: ${{ github.token }}

  # Model: Command Code provider API, billed against plan credits. The model itself is
  # picked per step below. Medium effort, measured 2026-11-08 on Lumo #182 (41k-token diff):
  # 94s and 6 findings. High took 402s and returned 2: it thinks ~6x longer and prunes its
  # own findings. A 7-min /review looks dead from the PR, so slash commands felt broken.
  OPENAI_KEY: ${{ secrets.CMD_API_KEY }}
  OPENAI.API_BASE: https://api.commandcode.ai/provider/v1
  config.fallback_models: "[]"
  config.reasoning_effort: medium
  config.additional_reasoning_effort_models: '["openai/deepseek/deepseek-v4.1-flash-fast", "openai/z-ai/glm-5.3-flash"]'
  config.custom_model_max_tokens: "128000"
  config.max_model_tokens: "128000"

  # No LiteLLM retries. PR-Agent still retries a failed call once on its own (hardcoded
  # MODEL_RETRIES=2), and ai_timeout is not a hard wall: on 2026-11-04 a dead upstream held
  # one review for 12 min across 4 attempts. The real limit is each step's timeout-minutes.
  config.ai_timeout: "480"
  config.num_retries: "0"
  config.retry_same_model_on_timeout: "false"

  # More code around each hunk, so the model sees the function a change lands in and can
  # catch callers and branches the diff alone hides. AGENTS.md (or CLAUDE.md) from the
  # default branch rides along, so findings follow the repo's own conventions.
  config.patch_extra_lines_before: "10"
  config.patch_extra_lines_after: "6"
  config.max_extra_lines_before_dynamic_context: "30"
  config.repo_context_files: '[["AGENTS.md", "CLAUDE.md"]]'

  # Only /review runs on open and push. Describe is off so my PR bodies stay mine.
  github_action_config.auto_review: "true"
  github_action_config.auto_improve: "false"
  github_action_config.auto_describe: "false"
  github_action_config.push_commands: '["/review"]'
  github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
  github_action_config.handle_push_trigger: "true"

  # CodeRabbit-style output: each finding is an inline comment on its line. Summary
  # comments are edited in place and inline comments are fingerprinted, so a push never
  # re-posts the same finding. A commented /improve posts one-click committable fixes.
  pr_reviewer.persistent_comment: "true"
  config.persistent_inline_comments: "true"
  pr_reviewer.inline_key_issues: "true"
  pr_code_suggestions.committable_code_suggestions: "true"
  pr_code_suggestions.suggestions_score_threshold: "6"

  pr_reviewer.num_max_findings: "20"
  pr_reviewer.require_tests_review: "false"
  pr_reviewer.require_estimate_effort_to_review: "false"
  # Coverage and precision, in that order of reading. PR-Agent is one model call over the
  # diff: it cannot open other files, so every finding must be provable from what it sees.
  # Findings get re-checked by a stronger model; a guessed one costs more than a missed one.
  pr_reviewer.extra_instructions: &focus >-
    Coverage: go through every changed file, not just the first few, and list every defect
    you can prove, each as its own issue, most severe first. Check for logic bugs (wrong
    conditions, off-by-one, inverted checks, wrong variable, stale state); unhandled edge
    cases (null or empty input, error paths, races, partial failure); security (injection,
    XSS, SSRF, path traversal, missing auth or ownership checks, secrets in code or logs,
    trusting client input); what the change misses (a caller, type, validation, cleanup or
    code path left behind inside the diff); inconsistencies with how the same thing is done
    elsewhere in the diff or the repo context; type-safety holes; and in UI code,
    accessibility plus missing loading, error, and empty states.
    Precision, which outranks coverage: you only see the diff and a few lines around each
    hunk. Never assume what code you cannot see does. Report an issue only if you can trace
    the trigger from the input to the wrong result through code that is in front of you.
    If the issue depends on a caller, a type, framework behaviour or state outside what is
    shown, do not report it. Before you keep a finding, re-read the code for a guard, early
    return, check or caller in the diff that already prevents it, and drop the finding if
    one exists. A test in the diff that asserts a behaviour, or a code comment explaining a
    choice, means it is intended: do not flag it unless the code contradicts it.
    Write each finding with the exact lines that cause it, the input or sequence that
    triggers it, and what goes wrong. No hedged or speculative findings ("might", "could
    potentially", "if X is not handled elsewhere"). Skip formatting, naming taste, and
    generic advice such as "add tests" or "consider logging". An empty list is fine when
    nothing is provable.
  pr_code_suggestions.extra_instructions: *focus

jobs:
  # Inline findings on open/push, plus every /command typed on the PR.
  review:
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.user.login == github.repository_owner
        && !github.event.pull_request.draft)
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.issue.state == 'open'
        && github.event.comment.user.login == github.repository_owner
        && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Primary: GLM-5.3 Flash, hard-killed at 10 min. A failed or timed-out review exits
      # non-zero, so the fallback step below takes over.
      - id: primary
        uses: docker://pragent/pr-agent:0.49.0-github_action
        timeout-minutes: 10
        continue-on-error: true
        env:
          config.model: openai/z-ai/glm-5.3-flash
          pr_reviewer.publish_review_failure_comment: "false"

      # Fallback: DeepSeek V4.1 Flash Fast, only when GLM failed. If this fails too, the job is red.
      - if: steps.primary.outcome == 'failure'
        uses: docker://pragent/pr-agent:0.49.0-github_action
        timeout-minutes: 9
        env:
          config.model: openai/deepseek/deepseek-v4.1-flash-fast
