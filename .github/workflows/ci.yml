# Quality gate for every PR and every push to main: typecheck, tests and builds for the
# action and the site through Turborepo, plus a check that the committed action bundle
# matches its source (other repos run packages/action/dist as committed).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main never are, so every merged commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm comes from corepack in the next step, so setup-node cannot cache it yet.
          package-manager-cache: false
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test build
      - name: Action bundle matches its source
        run: git diff --exit-code -- packages/action/dist || (echo "::error::packages/action/dist is stale, run pnpm build and commit it" && exit 1)
