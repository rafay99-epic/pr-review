<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="t">
  <title id="t">Your model key is sealed in your browser with the server's public key. The sealed text goes in .reviewpilot.yml on your default branch. Only the hosted server can open it, only for your account, and it sends the key only to the provider you sealed it for.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c5c5c"/></marker></defs>
  <g fill="none" stroke="#2a2a2a">
    <rect x="10" y="40" width="160" height="56" rx="8"/>
    <rect x="210" y="40" width="160" height="56" rx="8"/>
    <rect x="410" y="40" width="160" height="56" rx="8" stroke="#3fb950"/>
    <rect x="610" y="40" width="160" height="56" rx="8"/>
  </g>
  <g stroke="#5c5c5c" fill="none" marker-end="url(#a)"><path d="M170 68H208"/><path d="M370 68H408"/><path d="M570 68H608"/></g>
  <g fill="#fff" font-size="12" text-anchor="middle">
    <text x="90" y="64">your model key</text><text x="90" y="82" fill="#9a9a9a" font-size="11">sealed in the browser</text>
    <text x="290" y="64">.reviewpilot.yml</text><text x="290" y="82" fill="#9a9a9a" font-size="11">sealed_key, main branch</text>
    <text x="490" y="64" fill="#3fb950">hosted server</text><text x="490" y="82" fill="#9a9a9a" font-size="11">opens it, checks owner</text>
    <text x="690" y="64">your provider</text><text x="690" y="82" fill="#9a9a9a" font-size="11">the URL you sealed</text>
  </g>
  <g fill="#9a9a9a" font-size="11" text-anchor="middle">
    <text x="390" y="130">a copied sealed_key fails in another account's repos,</text>
    <text x="390" y="148">and the key can never be pointed at a different URL</text>
  </g>
</svg>
