<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img" aria-labelledby="t">
  <title id="t">A pull request or push starts a review. Find agents suggest issues, verify agents try to disprove each one, and the score comes from what survives. Below 5 you fix and push, which starts the next review. At 5 of 5 the check is green.</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5c5c5c"/></marker></defs>
  <g fill="none" stroke="#2a2a2a">
    <rect x="10" y="30" width="140" height="50" rx="8"/>
    <rect x="210" y="30" width="140" height="50" rx="8"/>
    <rect x="410" y="30" width="140" height="50" rx="8"/>
    <rect x="610" y="30" width="150" height="50" rx="8"/>
    <rect x="610" y="150" width="150" height="50" rx="8" stroke="#3fb950"/>
    <rect x="300" y="150" width="200" height="50" rx="8" stroke="#f85149"/>
  </g>
  <g stroke="#5c5c5c" fill="none" marker-end="url(#a)">
    <path d="M150 55H208"/><path d="M350 55H408"/><path d="M550 55H608"/>
    <path d="M685 80V148"/>
    <path d="M640 80 C 600 120, 540 150, 502 168"/>
    <path d="M300 180 C 160 180, 80 140, 80 82"/>
  </g>
  <g fill="#fff" font-size="13" text-anchor="middle">
    <text x="80" y="60">PR or push</text><text x="280" y="60">find</text><text x="480" y="60">verify</text><text x="685" y="60">score 1 to 5</text>
    <text x="685" y="180" fill="#3fb950">5/5, check green</text><text x="400" y="180" fill="#f85149">below 5: fix, push</text>
  </g>
  <g fill="#9a9a9a" font-size="11" text-anchor="middle">
    <text x="280" y="100">agents read the code</text><text x="280" y="114">and suggest issues</text>
    <text x="480" y="100">a fresh agent tries</text><text x="480" y="114">to disprove each one</text>
    <text x="700" y="118" text-anchor="start">= 5</text>
    <text x="560" y="134">&lt; 5</text>
    <text x="150" y="212">the next review only rereads files that changed</text>
  </g>
</svg>
