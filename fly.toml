# ReviewPilot server on Fly.io. One machine with a volume for warm clones and pending jobs.
# The server exits when idle (machine stops, nothing billed but the volume) and Fly starts it
# again on the next webhook. Proxy auto-stop stays off: it would cut reviews running in the
# background. Secrets (fly secrets set): WEBHOOK_SECRET, APP_ID, PRIVATE_KEY, and optionally
# REVIEWPILOT_API_KEY (the server's own model key) and SEAL_KEY (opens keys repos seal for it).
app = "reviewpilot-rafay"
primary_region = "iad"
kill_signal = "SIGTERM"
# Longer than the server's own shutdown (DRAIN_MS in packages/server/src/main.ts), so a
# review that is posting during a deploy finishes instead of being cut mid-post.
kill_timeout = 150

[env]
  DATA_DIR = "/data"
  # Comma-separated owner/repo or owner/* entries that may use REVIEWPILOT_API_KEY. Every repo
  # of these accounts with the App installed is reviewed on it, new ones included. Any other
  # repo needs its own sealed key, so nobody else can spend this one. Empty: every repo.
  REPOS = "rafay99-epic/*"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

[[restart]]
  policy = "on-failure"
  retries = 5

[mounts]
  source = "reviewpilot_data"
  destination = "/data"
  initial_size = "5gb"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
